# cordon policy — the flat rule model (DESIGN §15). Root-owned, NOT user-writable
# (else a scraper writes itself in). Authored as text, applied explicitly with
# `cordon policy apply`; compiled in userspace and enforced in-kernel by the bpf-lsm
# backend. Default location: /etc/cordon/policy.toml (override via the daemon's
# `policy = …` config key).
#
# This file uses the verbose `[[rule]]` form. The same model can be written far more
# compactly in the line-oriented DSL — see cordon.example.dsl.policy.toml — and a
# `user = "name"` header lets `~` resolve for a root daemon. The two surfaces compile
# identically and may be mixed.
#
# A rule is `(who, where, action, policy)`:
#   who    — subject: an exe path, `*` (any), or `@subject-group`. (uid/cgroup/argv0
#            predicates arrive in M2.)
#   where  — object: a file or a directory (matched recursively as a subtree). `*` is
#            NOT allowed — the whole filesystem can't be default-denied.
#   action — read | write | create (M1, at open) [ execute | listdir | unlink | mkdir
#            | rmdir | rename arrive with their hooks]; a single value, a list, `*`
#            (all), or `@action-group`.
#   policy — allow (allow, silent) | audit (allow, log) | deny (deny, log) |
#            silence (deny, silent).
#
# Precedence (resolved in userspace; the kernel just takes the first match):
#   1. most-specific `where` wins (a file rule beats the subtree it sits in);
#   2. ancestor rules are inherited downward, so a file is still governed by its
#      subtree's rules for anything it doesn't override (copy-down);
#   3. deny beats allow at the same specificity (fail-safe);
#   4. a protected object with no matching rule is default-denied;
#   5. anything not under any rule is unmediated (allowed).
#
# There is no global mode (no enforce/permissive/off): the per-rule `policy` is the only
# enforcement level. Use `audit` to observe an object (allow + log — the safe-rollout
# preview), then switch that rule to `deny` to enforce it. "Off" is an empty policy (or a
# stopped daemon).

# --- groups: named, nestable, symmetric across all three axes ----------------
[group.subject.ssh-tools]
members = ["/usr/bin/ssh", "/usr/bin/scp", "/usr/bin/sftp"]

# A blessing class (DESIGN §16): a subject group with a `blessing = "<name>"` predicate
# instead of `members`. `cordon bless --class ro -- <cmd>` runs <cmd> in a cgroup tagged
# `ro`; this rule lets such a blessed process read the cloud creds (and only those — the
# object column is the scope). Subject-specificity makes the blessed `allow` outrank the
# `*` audit catch-all below, so a blessed reader goes silent while unknown ones stay logged.
[group.subject.blessed-ro]
blessing = "ro"

[group.object.cloud-creds]
members = ["~/.aws", "~/.config/gcloud", "~/.config/gh"]

[group.action.ro]
members = ["read", "listdir"]

# --- rules -------------------------------------------------------------------

# ssh tooling may read ~/.ssh; every other opener there is default-denied.
[[rule]]
who = "@ssh-tools"
where = "~/.ssh"
action = "@ro"
policy = "allow"

# a `cordon bless --class ro` process may read the cloud creds (runtime, PAM-authenticated
# grant; see DESIGN §16). The blessed allow outranks the `*` audit catch-all below by
# subject-specificity, so an interactive `cat ~/.aws/credentials` under a bless works
# without widening the catch-all.
[[rule]]
who = "@blessed-ro"
where = "@cloud-creds"
action = "@ro"
policy = "allow"

# the aws cli reads + writes its own creds.
[[rule]]
who = "/usr/bin/aws"
where = "~/.aws"
action = ["read", "write"]
policy = "allow"

# log (but allow) every *other* reader of the cloud-credential dirs — preview who
# touches them before tightening to a deny.
[[rule]]
who = "*"
where = "@cloud-creds"
action = "read"
policy = "audit"

# copy-down exception: aws may read ~/.aws (above), but never this one stashed token,
# and silently (deny + no log line). More-specific object → wins over the subtree
# allow, but only for this file and only for aws.
[[rule]]
who = "/usr/bin/aws"
where = "~/.aws/.danger-token"
action = "*"
policy = "silence"
