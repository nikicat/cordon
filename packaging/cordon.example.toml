# cordon daemon configuration (operational settings).
#
# All keys are optional; an absent file or key falls back to a built-in default.
# Precedence: CLI flag  >  this file  >  default. String values may interpolate
# ${ENV} from the environment.
#
# The *enforcement* policy — the rules (and their per-rule `policy`, the only
# enforcement level; there is no global mode) — is NOT here: it lives in the root-owned
# text policy file (see `policy` below and cordon.example.policy.toml), applied with
# `cordon policy apply`.
#
# Default location: /etc/cordon/config.toml (root) or
# $XDG_CONFIG_HOME/cordon/config.toml (user). Override with --config / $CORDON_CONFIG.

# Enforcement backend — only "bpf-lsm" (Linux, root: CAP_BPF + CAP_MAC_ADMIN). The
# hardened boundary: the verdict is returned in-kernel from BPF maps. Needs a kernel
# with CONFIG_BPF_LSM=y and `bpf` in the active LSM list (`lsm=…,bpf` on the kernel
# cmdline), the daemon's bpf-lsm backend (built in by default), and the eBPF object built
# via `just build-ebpf` (see bpf_object below).
backend = "bpf-lsm"

# IPC socket. Default: /run/cordon.sock (root); $XDG_RUNTIME_DIR/cordon.sock (user).
# socket = "${XDG_RUNTIME_DIR}/cordon.sock"

# Reserved for autolearn (M4): the roots where learning may propose rules. Accepted
# but unused by M1 enforcement.
# zones = ["${HOME}", "${HOME}/.config"]

# --- bpf-lsm backend ---------------------------------------------------------
# The compiled eBPF object the daemon loads at runtime. Default:
# /usr/lib/cordon/cordon.bpf.o (where packaging installs it). In a dev tree, point
# it at the `just build-ebpf` output:
# bpf_object = "${PWD}/target/bpf/cordon.bpf.o"
#
# bpffs directory the program + maps are pinned under for fail-safe enforcement
# (planned; see DESIGN §4). Default: /sys/fs/bpf/cordon.
# bpf_pin_dir = "/sys/fs/bpf/cordon"
#
# The root-owned text policy (the flat rule model — see cordon.example.policy.toml)
# the bpf-lsm backend compiles at startup and seeds the maps from. May be a single
# file or a conf.d *directory* of *.toml fragments merged in name order (each may carry
# a `user = "name"` header so `~` resolves under the root daemon). Default:
# /etc/cordon/policy.toml. Typical layouts:
# policy = "/etc/cordon/conf.d"                          # a directory of fragments
# policy = "${PWD}/packaging/cordon.example.policy.toml" # a single file, in a dev tree
