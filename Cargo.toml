[workspace]
resolver = "3"
members = ["crates/core", "crates/daemon", "crates/cli", "crates/bpf-common"]
# crates/bpf is the eBPF program: it builds only for the `bpfel-unknown-none`
# target with a pinned nightly (see crates/bpf/rust-toolchain.toml) and is driven
# by `just build-ebpf`, so it must NOT be a host-target workspace member.
exclude = ["crates/bpf"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nikicat/cordon"
rust-version = "1.95"

[workspace.dependencies]
cordon-core = { path = "crates/core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rusqlite_migration = "2.6.0"
toml = "1.1.2"
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"
tempfile = "3.27.0"
