[workspace]
resolver = "3"
members = ["crates/core", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nbryskin/cordon"
rust-version = "1.95"

[workspace.dependencies]
cordon-core = { path = "crates/core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rusqlite_migration = "2.6.0"
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"
