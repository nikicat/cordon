# Types shared verbatim between the eBPF program (crates/bpf, no_std, BPF target) and
# the userspace loader (crates/daemon, the `bpf-lsm` feature). Keeping the map key, value
# and record layouts in one place is what keeps the two sides from drifting.
#
# The default build is `#![no_std]` and depends only on `bitflags`, so the eBPF crate can
# pull it in cleanly. The userspace side enables the `user` feature for the `aya::Pod`
# impls, which let these types be map keys and values. Nothing else needs the userspace
# `aya` crate.
[package]
name = "cordon-bpf-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "cordon_bpf_common"
path = "src/lib.rs"

[features]
# Enabled by the userspace loader. It pulls in `aya` only to mark these POD types `Pod`.
user = ["dep:aya"]

[dependencies]
# For the `Action` bitset. bitflags is `no_std` with no transitive deps and generates
# plain `core` code, so it compiles for the BPF target. `default-features = false` keeps
# its `std` feature off, so the eBPF build stays `no_std`.
bitflags = { version = "2.13", default-features = false }
aya = { version = "0.14", optional = true, default-features = false }
