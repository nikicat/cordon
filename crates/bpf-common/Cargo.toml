# Types shared verbatim between the eBPF program (crates/bpf, no_std, BPF target)
# and the userspace loader (crates/daemon, the `bpf-lsm` feature). Keeping the map
# key/value/record layouts in ONE place is what keeps the two sides from drifting.
#
# Default build is `#![no_std]`: the only dependency is `bitflags` (itself
# zero-dep + `no_std`, pure `core` codegen), used for the `Action` bitset, so the
# eBPF crate can pull this in cleanly. The userspace side enables
# `features = ["user"]`, which adds the `aya::Pod` impls (so these types can be map
# keys/values) — that's the only thing that needs the userspace `aya` crate.
[package]
name = "cordon-bpf-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "cordon_bpf_common"
path = "src/lib.rs"

[features]
# Enabled by the userspace loader: pulls `aya` only to mark these POD types `Pod`.
user = ["dep:aya"]

[dependencies]
# `no_std`, zero transitive deps; compiles for the BPF target. `default-features =
# false` keeps the `std` feature off so the eBPF build stays `no_std`.
bitflags = { version = "2.13", default-features = false }
aya = { version = "0.14", optional = true, default-features = false }
