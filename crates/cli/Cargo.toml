[package]
name = "cordon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "cordon"
path = "src/main.rs"

[dependencies]
cordon-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
# `policy edit` drops privileges (setgroups/setgid/setuid) to run the editor as the
# invoking user, chowns the temp copy to them, and looks up their home — the sudoedit-style
# safety boundary. `user` = setuid/setgid/setgroups + passwd lookup; `fs` = chown.
nix = { version = "0.31.3", features = ["user", "fs"] }
