[package]
name = "cordon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "cordon"
path = "src/main.rs"

[dependencies]
cordon-core = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
# `policy edit`'s private temp dir and the atomic install of the saved policy.
tempfile = { workspace = true }
# `policy edit` runs the editor as the invoking user and chowns the temp copy to them.
# That is its sudoedit-style safety boundary. The `user` feature provides
# setuid, setgid and setgroups, and `fs` provides chown.
nix = { version = "0.31.3", features = ["user", "fs"] }
