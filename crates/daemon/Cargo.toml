[package]
name = "cordon-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "cordond"
path = "src/main.rs"

[features]
# The hardened Linux `bpf-lsm` backend. It is the rule model's only enforcement backend,
# so it is on by default. It builds on stable Rust, because only the eBPF object needs
# nightly, and `just build-ebpf` builds that object separately. Its deps (`aya`,
# `cordon-bpf-common`) are Linux-only and gated to the Linux target below, so a non-Linux
# `cargo build` still compiles, just with no working backend. Opt out with
# `--no-default-features`.
default = ["bpf-lsm"]
bpf-lsm = ["dep:aya", "dep:cordon-bpf-common"]

[dependencies]
cordon-core = { workspace = true }
clap = { workspace = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
# nix's `poll` drives the bpf-lsm ring-buffer reader, in place of hand-rolled `unsafe`.
nix = { version = "0.31.3", features = ["poll"] }
# The bpf-lsm control plane needs the aya loader and the map and record types it shares
# with the eBPF program. Only the default `bpf-lsm` feature pulls them in, and only on
# Linux, which is the one target the backend compiles on.
aya = { version = "0.14", optional = true }
cordon-bpf-common = { path = "../bpf-common", features = ["user"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
