# The eBPF data plane, which is the in-kernel boundary that returns the LSM hook verdicts.
#
# This crate is intentionally a standalone workspace (`[workspace]` below), excluded from
# the root workspace. It compiles only for `bpfel-unknown-none` with the pinned nightly
# (rust-toolchain.toml) and `bpf-linker`, driven by `just build-ebpf`. It must never be
# built for the host.
[package]
name = "cordon-bpf"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "cordon"
path = "src/main.rs"
# No host test or bench harness, because this #![no_std], #![no_main] BPF object cannot
# link the `test` crate. Disabling these auto-targets also lets rust-analyzer load this
# crate with its default `--all-targets` without a build error. rust-analyzer shares one
# window with the host workspace, which keeps `--all-targets` on for its tests.
test = false
bench = false

[dependencies]
aya-ebpf = "0.1.1"
# The shared map and record layout, without the `user` feature so that aya stays out.
cordon-bpf-common = { path = "../bpf-common" }

# eBPF objects must be optimized and free of unwinding. The verifier rejects the bloated,
# high-stack code that a debug build emits.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

# Standalone: do not join the parent workspace.
[workspace]
