# The eBPF crate compiles only with a nightly toolchain, because aya-ebpf and build-std
# need one. It is pinned to a date so that the objects are reproducible. `just build-ebpf`
# resolves it, and rustup fetches it on first use.
[toolchain]
channel = "nightly-2026-06-23"
components = ["rust-src", "rustfmt", "clippy"]
