name: ci

on:
  push:
  pull_request:

# Third-party actions are pinned to a commit SHA, not a tag: a tag is mutable, so
# `@v7` is a promise the upstream owner (or anyone who compromises them) can rewrite
# under us — and these actions run with a token in the repo's own CI. The trailing
# comment is the human-readable version the SHA belongs to; bump both together.
#
# `dtolnay/rust-toolchain` selects the toolchain from the *ref* (`@stable`), which a
# SHA can't express — so the `toolchain:` input says it explicitly instead.
jobs:
  # Unprivileged: the policy core, store, decision flow, and IPC e2e. Covers
  # everything except the kernel interception (mock backend stands in).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # (The `fanotify-vm` job was removed: the fanotify backend was retired with the
  # owner model in M1 1f. `bpf-lsm` is the only kernel backend, validated below.)

  # Privileged boundary: the bpf-lsm backend, in a virtme-ng VM booting a pinned
  # kernel with `bpf` added to the active LSM list (`lsm=…,bpf`). Adds the eBPF
  # toolchain — the pinned nightly (crates/bpf/rust-toolchain.toml, fetched on demand)
  # and bpf-linker — to build the in-kernel object. The kernel needs CONFIG_BPF_LSM=y
  # (set in the Ubuntu mainline build).
  bpf-lsm-vm:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # v4, not v3: v3's nested setup-crate still declares node20, which the runner
      # force-runs on node24 with a deprecation annotation on every run.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install qemu + virtme-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 jq
          pipx install virtme-ng
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install bpf-linker
        run: cargo install bpf-linker --locked
      - name: bpf-lsm smoke test in a virtme-ng VM (pinned kernel v6.12, lsm=…,bpf)
        env:
          CORDON_VM_KERNEL: v6.12
        run: packaging/test/run-bpf-lsm-vm.sh
