name: ci

on:
  push:
  pull_request:

# Third-party actions are pinned to a commit SHA, not a tag. A tag is mutable, so the
# upstream owner, or anyone who compromises them, can change what `@v7` points at, and
# these actions run with a token in the repo's own CI. The trailing comment names the
# version the SHA belongs to, so bump both together.
#
# `dtolnay/rust-toolchain` selects the toolchain from the ref (`@stable`), which a SHA
# cannot express. So the `toolchain:` input names it explicitly instead.
jobs:
  # Checks everything that needs no privilege. The in-kernel boundary is left to the VM
  # job below.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-08-05
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just test

  # Tests the bpf-lsm backend, which is the privileged boundary, in a virtme-ng VM. The VM
  # boots a pinned kernel with `bpf` added to the active LSM list (`lsm=…,bpf`), and the
  # Ubuntu mainline kernel build sets CONFIG_BPF_LSM=y. To build the in-kernel object, the
  # job adds the eBPF toolchain. That is the nightly pinned in crates/bpf/rust-toolchain.toml
  # and the bpf-linker pinned in the justfile, both fetched on demand.
  bpf-lsm-vm:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-08-05
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # v4, not v3: v3's nested setup-crate still declares node20, which the runner
      # force-runs on node24 with a deprecation annotation on every run.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install qemu + virtme-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 jq zstd
          pipx install virtme-ng
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: bpf-lsm smoke test in a virtme-ng VM (pinned kernel v6.12, lsm=…,bpf)
        env:
          CORDON_VM_KERNEL: v6.12
        run: packaging/test/run-bpf-lsm-vm.sh
